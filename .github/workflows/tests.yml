name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  determinism:
    # Guards the eid / gene-ordering contract: the suite must pass regardless
    # of PYTHONHASHSEED, i.e. nothing may depend on set/dict hash order.
    name: determinism (PYTHONHASHSEED=${{ matrix.hashseed }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hashseed: ["0", "1", "2"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests with fixed hash seed
        env:
          PYTHONHASHSEED: ${{ matrix.hashseed }}
        run: python -m pytest -q
